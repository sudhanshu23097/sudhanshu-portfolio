<!DOCTYPE html>
<html>
<head>
  <title>Sudhanshu Kumar - Portfolio</title>
</head>
<body>
  <h1>My Portfolio</h1>
  <div id="portfolio"></div>

  <script>
    if (window.ActiveXObject || "ActiveXObject" in window) {
      // For old IE
      var xml = new ActiveXObject("Microsoft.XMLDOM");
      xml.async = false;
      xml.load("portfolio.xml");
      var xsl = new ActiveXObject("Microsoft.XMLDOM");
      xsl.async = false;
      xsl.load("portfolio.xsl");
      document.getElementById("portfolio").innerHTML = xml.transformNode(xsl);
    } else if (document.implementation && document.implementation.createDocument) {
      // For modern browsers
      var xhttp = new XMLHttpRequest();
      xhttp.open("GET", "portfolio.xml", false);
      xhttp.send();
      var xml = xhttp.responseXML;

      xhttp = new XMLHttpRequest();
      xhttp.open("GET", "portfolio.xsl", false);
      xhttp.send();
      var xsl = xhttp.responseXML;

      // Transform
      var xsltProcessor = new XSLTProcessor();
      xsltProcessor.importStylesheet(xsl);
      var resultDocument = xsltProcessor.transformToFragment(xml, document);
      document.getElementById("portfolio").appendChild(resultDocument);
    } else {
      document.getElementById("portfolio").innerHTML = "XSLT not supported in your browser.";
    }
  </script>
</body>
</html>
